[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-lab"
version = "0.1.0"
description = "Agent EngineeringとLLMOpsを学び、探究するためのコーディングエージェント"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_agent = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
